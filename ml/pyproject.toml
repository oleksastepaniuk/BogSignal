[project]
name = "bogsignal"
version = "0.1.0"
description = "Experimental satellite-based wetland mapping for Polissia."
requires-python = ">=3.11"
dependencies = [
    "asf-search",
    "duckdb",
    "earthaccess",
    "earthengine-api>=1.7.52",
    "geopandas",
    "h5py",
    "numpy",
    "pyarrow",
    "pyproj",
    "rasterio",
    "shapely>=2.1",
]

[project.optional-dependencies]
training = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "segmentation-models-pytorch==0.5.0",
    "matplotlib==3.10.7",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
bogsignal-dataset = "bogsignal.dataset.pipeline:main"
bogsignal-train = "bogsignal.training.train:main"

[tool.setuptools.packages.find]
where = ["src"]
